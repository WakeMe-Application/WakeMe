name: 기능 제안
description: 이런 게 있으면 좋겠습니다
labels: ["type: feat", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 불편했나요
      description: 기능이 아니라 **상황**을 적어 주세요. 해결 방법은 달라질 수 있습니다.
      placeholder: 환승역에서 내린 뒤 다음 열차를 탈 때까지 앱이 뭘 해야 할지 몰랐습니다.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 떠오른 방법 (선택)
  - type: dropdown
    id: area
    attributes:
      label: 어느 부분인가요
      options:
        - 앱 화면 (app)
        - 판정 엔진 (engine)
        - 노선·공공데이터 (data)
        - PoC 로거 (poc)
        - 모르겠음
